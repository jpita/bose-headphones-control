name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt
      - run: npm ci
      - run: npm test
